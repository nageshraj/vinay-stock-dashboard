name: ChartPulse CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Validate FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Backend Import & Syntax
        run: |
          cd backend
          python -c "import main, screener_engine, fyers_service; print('Backend modules import successfully!')"

  test-frontend:
    name: Validate React Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Production Build Test
        run: |
          cd frontend
          npm run build
