name: Keep Render Awake

on:
  schedule:
    # Ping every 14 minutes to prevent Render free tier cold starts (spins down after 15 min)
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          echo "Pinging Render backend to keep it warm..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vinay-stock-dashboard.onrender.com/api/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render backend is alive and healthy!"
          else
            echo "⚠️  Unexpected status code: $STATUS (may be a cold start, next ping will retry)"
          fi
